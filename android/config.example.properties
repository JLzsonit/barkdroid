# Android build config — copy this to config.properties and fill in your values.
# This file is git-ignored.

# Your custom application ID (package name). Keep it the same across versions,
# otherwise the new APK cannot upgrade over the installed one.
APPLICATION_ID=com.example.barkdroid

# Default ntfy server (can be changed later in the app's settings page).
NTFY_SERVER=https://ntfy.sh
